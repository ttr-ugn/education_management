<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hệ thống Quản lý văn bản điều hành - Sở GD&ĐT TP. Đà Nẵng</title>
  <link rel="icon" type="image/svg+xml" href="assets/logo-sodad.svg">
  <link rel="stylesheet" href="css/base.css">
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      background: linear-gradient(135deg, #002b53 0%, #004b91 100%);
      color: #ffffff;
      text-align: center;
      font-family: var(--font-family);
    }
    .loading-card {
      background-color: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      padding: 40px;
      border-radius: var(--radius-lg);
      border: 1px solid rgba(255, 255, 255, 0.2);
      max-width: 420px;
      width: 90%;
    }
    .spinner-lg {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(255, 255, 255, 0.3);
      border-top-color: #ffd700;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 20px auto;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="loading-card">
    <img src="assets/logo-sodad.svg" alt="Logo Sở GD&ĐT Đà Nẵng" style="width: 72px; height: 72px; margin-bottom: 16px;">
    <h2 style="font-size: 16px; text-transform: uppercase; letter-spacing: 0.5px; color: #ffd700; margin-bottom: 4px;">
      Sở Giáo dục và Đào tạo TP. Đà Nẵng
    </h2>
    <p style="font-size: 13px; opacity: 0.8; margin-bottom: 16px;">
      Hệ thống Quản lý văn bản & Điều hành nội bộ
    </p>
    <div class="spinner-lg"></div>
    <p style="font-size: 12.5px; opacity: 0.7;">Đang kiểm tra phiên làm việc...</p>
  </div>

  <script src="js/core/api.js?v=20261111_07"></script>
  <script>
    // Kiểm tra trạng thái đăng nhập để điều hướng
    (async function() {
      try {
        const res = await window.api.get('/api/auth/toi');
        if (res && res.thanh_cong && res.du_lieu) {
          if (res.du_lieu.bat_buoc_doi_mat_khau) {
            window.location.replace('pages/doi-mat-khau.html?required=1');
          } else {
            window.location.replace('pages/dashboard.html');
          }
          return;
        }
      } catch (err) {
        // Chưa đăng nhập -> chuyển về login
      }
      window.location.replace('pages/login.html');
    })();
  </script>
</body>
</html>
