<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng nhập - Quản lý văn bản điều hành Sở GD&ĐT TP. Đà Nẵng</title>
  <link rel="icon" type="image/svg+xml" href="../assets/logo-sodad.svg">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/auth.css">
</head>
<body class="auth-page">

  <!-- Quốc hiệu & Tiêu ngữ hành chính -->
  <header class="auth-header-bar">
    <div class="national-header">
      <div class="national-motto">CỘNG HÒA XÃ HỘI CHỦ NGHĨA VIỆT NAM</div>
      <div class="national-submotto">Độc lập - Tự do - Hạnh phúc</div>
    </div>
  </header>

  <main class="auth-container">
    <div class="auth-card">
      <div class="auth-card-header">
        <img src="../assets/logo-sodad.svg" alt="Logo Sở GD&ĐT Đà Nẵng" class="auth-logo">
        <h1 class="auth-title">ĐĂNG NHẬP HỆ THỐNG</h1>
        <p class="auth-subtitle">QUẢN LÝ VĂN BẢN VÀ ĐIỀU HÀNH NỘI BỘ</p>
        <p style="font-size: 11.5px; color: var(--primary-light); font-weight: 600; margin-top: 2px;">
          SỞ GIÁO DỤC VÀ ĐÀO TẠO THÀNH PHỐ ĐÀ NẴNG
        </p>
      </div>

      <div class="auth-card-body">
        <!-- Hộp thông báo lỗi/trạng thái tài khoản -->
        <div id="loginAlert" class="auth-alert" role="alert">
          <span id="alertIcon" style="font-weight: bold;">⚠</span>
          <span id="alertMessage"></span>
        </div>

        <form id="loginForm" novalidate>
          <div class="form-group">
            <label for="ten_dang_nhap" class="form-label required">Tên đăng nhập</label>
            <input
              type="text"
              id="ten_dang_nhap"
              name="ten_dang_nhap"
              class="form-control"
              placeholder="Nhập tên đăng nhập hoặc mã cán bộ"
              autocomplete="username"
              required
              autofocus
            >
          </div>

          <div class="form-group">
            <div class="d-flex justify-content-between align-items-center mb-1">
              <label for="mat_khau" class="form-label required" style="margin-bottom: 0;">Mật khẩu</label>
            </div>
            <div class="password-field-wrapper">
              <input
                type="password"
                id="mat_khau"
                name="mat_khau"
                class="form-control"
                placeholder="Nhập mật khẩu"
                autocomplete="current-password"
                required
              >
              <button type="button" class="password-toggle-btn" id="togglePasswordBtn" title="Hiện/Ẩn mật khẩu" aria-label="Hiện/Ẩn mật khẩu">
                <svg id="eyeIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                  <circle cx="12" cy="12" r="3"></circle>
                </svg>
              </button>
            </div>
          </div>

          <button type="submit" id="submitBtn" class="btn btn-primary w-100 btn-lg mt-3">
            <span id="btnSpinner" class="spinner d-none"></span>
            <span id="btnText">Đăng nhập</span>
          </button>
        </form>

        <div class="auth-footer">
          Chưa có tài khoản cán bộ?
          <a href="register.html" class="fw-bold">Đăng ký tài khoản</a>
        </div>
      </div>
    </div>
  </main>

  <footer class="auth-bottom-info">
    © 2026 Sở Giáo dục và Đào tạo thành phố Đà Nẵng. Hệ thống lưu hành nội bộ.
  </footer>

  <script src="../js/core/toast.js?v=20261111_07"></script>
  <script src="../js/core/api.js?v=20261111_07"></script>
  <script src="../js/auth/login.js?v=20261111_07"></script>
</body>
</html>
